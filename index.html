    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: #a7a5a5;
            text-align: center;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: auto;
            padding-top: 56.25%;
            /* 16:9 aspect ratio */
        }

        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 5px solid black;
            /* Black border around video */
        }

        /* Contact section animation */
        .contact-section {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease forwards;
            animation-delay: 0.5s;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .contact-links a {
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .contact-links a:hover {
            transform: scale(1.1);
            color: #444;
        }

        /* Waving flag container */
        .flag-container {
            background-image: url('https://upload.wikimedia.org/wikipedia/en/a/ae/Flag_of_the_United_Kingdom.svg');
            background-size: cover;
            background-position: center;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            text-align: center;

            /* Animation properties */
            animation: wave 5s ease-in-out infinite;
            transform-origin: center center;
        }

        /* Keyframes for waving effect */
        @keyframes wave {
            0% {
                transform: perspective(600px) rotateY(0deg) skewY(0deg) scale(1);
                background-position: center;
            }

            25% {
                transform: perspective(600px) rotateY(-2deg) skewY(1deg) scale(1.01);
                background-position: 48% center;
            }

            50% {
                transform: perspective(600px) rotateY(0deg) skewY(0deg) scale(1);
                background-position: center;
            }

            75% {
                transform: perspective(600px) rotateY(2deg) skewY(-1deg) scale(1.01);
                background-position: 52% center;
            }

            100% {
                transform: perspective(600px) rotateY(0deg) skewY(0deg) scale(1);
                background-position: center;
            }
        }
    </style>

            <!-- Hidden password form -->

                <form onsubmit="return checkAccessCode()">
                    <input type="password" id="codeInput" placeholder="Enter Access Code"
                        style="padding: 10px; font-size: 16px;" required />
                    <button type="submit" style="padding: 10px 15px; font-size: 16px;">View</button>
                </form>
            </div>

            <script>
                function checkAccessCode() {
                    const correctCode = "1989"; // Replace with your real access code
                    const userInput = document.getElementById("codeInput").value;

                    if (userInput === correctCode) {
                        // Open the license in a new tab
                        window.open("assets/photo/driver-license.jpeg", "_blank");

                        // Delay refresh so user has time to view it
                        setTimeout(() => {
                            window.location.reload(); // Refresh the page
                        }, 3000); // 3 seconds delay
                    } else {
                        alert("Incorrect access code Mate, try again.");
                    }

                    return false; // Prevent form submission
                }
            </script>
